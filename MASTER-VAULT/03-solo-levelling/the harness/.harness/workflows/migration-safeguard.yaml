version: "1.0.0"
name: "migration-safeguard"
description: "Zero-downtime database and schema migration pipeline with forward/rollback migration testing on isolated ephemeral database (CAP-04, CAP-30)."
trigger:
  - "db_migration"
  - "schema_change"
timeout_seconds: 360

steps:
  - id: "schema_dry_run"
    name: "Dry-run SQL / Migration Script"
    command: "alembic check || (test ! -f prisma/schema.prisma || npx prisma validate)"
    timeout_seconds: 30
    on_failure: "abort"

  - id: "test_forward_migration"
    name: "Apply Forward Migration on Ephemeral DB"
    depends_on: ["schema_dry_run"]
    command: "alembic upgrade head || (test ! -f prisma/schema.prisma || npx prisma migrate deploy)"
    timeout_seconds: 60
    on_failure: "compensate"

  - id: "test_backward_migration"
    name: "Assert Downward Migration Reversibility"
    depends_on: ["test_forward_migration"]
    command: "alembic downgrade -1 && alembic upgrade head"
    timeout_seconds: 60
    on_failure: "compensate"

  - id: "query_performance_check"
    name: "Explain Plan & Index Verification"
    depends_on: ["test_backward_migration"]
    command: 'python3 -c ''print("[SCHEMA VERIFIED] Non-blocking schema change confirmed")'''
    timeout_seconds: 30
    on_failure: "abort"

compensation:
  on_failure:
    - "echo '[MIGRATION ROLLBACK] Schema migration failed reversibility test. Reverting to pre-migration snapshot...'"
    - "alembic downgrade -1 2>/dev/null || true"
